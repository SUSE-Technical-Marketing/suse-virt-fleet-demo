kind: Secret
apiVersion: v1
metadata:
  name: hartmann-fleet-cloudinit
  namespace: tenant-hartmann-ag
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/vmName: hartmann-fleet-app
    harvesterhci.io/cloud-init-template: "harvester"
stringData:
  networkData: ""
  userData: |
    ## template: jinja
    #cloud-config

    users:
      - name: jeroen
        sudo: ALL=(ALL) NOPASSWD:ALL
        passwd: "$6$FwXqnOc8hOs0Z65p$ZoBsbamvwbew.ryHzIqW3yy0pUgCHCbhq6WqRWuHwclg66imPz\
          4uGwX0SrgLm7kk6d3Ji/Na32pN8ktZrGPhx1"
        ssh_authorized_keys:
          - ssh-rsa
            
          - ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIHkFvXkGD1yoUsEMijoNi3tb0MlB3CiuQVdvpFsOf7P+
            jeroen@localhost.localdomain
          - ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIBSE68VYUiwL5a8xcmv34RZ1OYnrEcRBe4NaeKpE/twU
            jeroen@hierynomus.com
        lock_passwd: false
        shell: /bin/bash

    packages:
      - curl
      - qemu-guest-agent
      - helm

    package_update: true

    write_files:
      - path: /etc/rancher/k3s/config.yaml
        content: |
          write-kubeconfig-mode: "0644"
          tls-san:
          - {{ ds.meta_data.local_hostname }}.lab.geeko.me
      - path: /tmp/install_k3s.sh
        content: |
          #!/bin/bash
          curl -sfL https://get.k3s.io -o get-k3s.sh
          INSTALL_K3S_CHANNEL="v1.31.5+k3s1" INSTALL_K3S_EXEC="--disable=traefik" sh get-k3s.sh
        permissions: '0755'

    runcmd:
      - firewall-cmd --permanent --add-port=6443/tcp
      - firewall-cmd --permanent --zone=trusted --add-source=10.42.0.0/16
      - firewall-cmd --permanent --zone=trusted --add-source=10.43.0.0/16
      - firewall-cmd --reload
      - echo "net.ipv6.conf.all.disable_ipv6=1" >> /etc/sysctl.conf
      - echo "net.ipv6.conf.default.disable_ipv6=1" >> /etc/sysctl.conf
      - echo "net.ipv6.conf.tun0.disable_ipv6=1" >> /etc/sysctl.conf
      - sysctl -p
      - - systemctl
        - enable
        - --now
        - qemu-guest-agent.service
    ssh_authorized_keys:
      - ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAIBSE68VYUiwL5a8xcmv34RZ1OYnrEcRBe4NaeKpE/twU
        jeroen@hierynomus.com

---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  namespace: tenant-hartmann-ag
  annotations:
    harvesterhci.io/volumeClaimTemplates: >-
      [{"metadata":{"name":"hartmann-fleet-app-disk-0-925et","annotations":{"harvesterhci.io/imageId":"harvester-public/opensuse-leap-15.6"}},"spec":{"accessModes":["ReadWriteMany"],"resources":{"requests":{"storage":"50Gi"}},"volumeMode":"Block","storageClassName":"longhorn-single"}}]
    network.harvesterhci.io/ips: '[]'
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: openSUSE
  name: hartmann-fleet-app
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      annotations:
        harvesterhci.io/sshNames: '["default/jeroen"]'
      labels:
        harvesterhci.io/vmName: hartmann-fleet-app
    spec:
      architecture: amd64
      domain:
        machine:
          type: ''
        cpu:
          cores: 2
          sockets: 1
          threads: 1
        devices:
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - bridge: {}
              model: virtio
              name: default
          disks:
            - name: disk-0
              disk:
                bus: virtio
              bootOrder: 1
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          limits:
            memory: 6Gi
            cpu: '2'
        memory:
          guest: 6Gi
        features:
          acpi:
            enabled: true
      evictionStrategy: LiveMigrateIfPossible
      hostname: hartmann-fleet-app
      networks:
        - name: default
          multus:
            networkName: default/vlan50
      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: hartmann-fleet-app-disk-0-925et
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: hartmann-fleet-app-cloudinit
            networkDataSecretRef:
              name: hartmann-fleet-app-cloudinit
      affinity: {}
      terminationGracePeriodSeconds: 120
      accessCredentials: []
